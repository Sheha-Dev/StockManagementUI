<form [formGroup]="requestForm" (ngSubmit)="submitRequest()" class="stock-request-form" novalidate>
    <h2>Create Stock Request</h2>

    <!-- Error Message -->
    <div *ngIf="errorMessage" class="error-message" role="alert">
        {{ errorMessage }}
    </div>

    <!-- Branch Selection -->
    <div class="branch-section">

        <!-- From Branch -->
        <div class="form-group">
            <label for="fromBranchId">From Branch</label>

            <select id="fromBranchId" formControlName="fromBranchId" [attr.aria-invalid]="
          requestForm.get('fromBranchId')?.touched &&
          requestForm.get('fromBranchId')?.invalid
        ">
                <option value="">Select From Branch</option>

                <option *ngFor="let branch of branches" [value]="branch.branchId" [disabled]="
            branch.branchId ===
            requestForm.get('toBranchId')?.value
          ">
                    {{ branch.branchName }}
                </option>
            </select>

            <small class="validation-error" *ngIf="
          requestForm.get('fromBranchId')?.touched &&
          requestForm.get('fromBranchId')?.hasError('required')
        ">
                Please select a source branch.
            </small>
        </div>

        <!-- To Branch -->
        <div class="form-group">
            <label for="toBranchId">To Branch</label>

            <select id="toBranchId" formControlName="toBranchId" [attr.aria-invalid]="
          requestForm.get('toBranchId')?.touched &&
          requestForm.get('toBranchId')?.invalid
        ">
                <option value="">Select To Branch</option>

                <option *ngFor="let branch of branches" [value]="branch.branchId" [disabled]="
            branch.branchId ===
            requestForm.get('fromBranchId')?.value
          ">
                    {{ branch.branchName }}
                </option>
            </select>

            <small class="validation-error" *ngIf="
          requestForm.get('toBranchId')?.touched &&
          requestForm.get('toBranchId')?.hasError('required')
        ">
                Please select a destination branch.
            </small>
        </div>

    </div>

    <p class="loading-message" *ngIf="loadingBranches">
        Loading branches...
    </p>

    <!-- Request Items -->
    <div class="request-items-section">

        <div class="section-header">
            <h3>Request Items</h3>

            <button type="button" (click)="addItem()" [disabled]="loadingProducts || submitting">
                + Add Item
            </button>
        </div>

        <div formArrayName="requestItems">

            <div class="request-item" *ngFor="
          let item of requestItems.controls;
          let i = index
        " [formGroupName]="i">

                <h4>Item {{ i + 1 }}</h4>

                <!-- Product -->
                <div class="form-group">
                    <label [for]="'productId-' + i">Product</label>


                    <select [id]="'productId-' + i" formControlName="productId">
                        <option value="">Select Product</option>

                        <option *ngFor="let product of products" [value]="product.productId"
                            [disabled]="isProductAlreadySelected(product.productId, i)">
                            {{ product.productName }}
                        </option>
                    </select>


                    <small class="validation-error" *ngIf="
              item.get('productId')?.touched &&
              item.get('productId')?.hasError('required')
            ">
                        Please select a product.
                    </small>
                </div>

                <!-- Quantity -->
                <div class="form-group">
                    <label [for]="'quantity-' + i">Quantity</label>

                    <input [id]="'quantity-' + i" type="number" formControlName="quantity" min="1" step="1"
                        placeholder="Enter quantity" [attr.aria-invalid]="
              item.get('quantity')?.touched &&
              item.get('quantity')?.invalid
            " />

                    <small class="validation-error" *ngIf="
              item.get('quantity')?.touched &&
              item.get('quantity')?.invalid
            ">
                        Enter a whole-number quantity greater than zero.
                    </small>
                </div>

                <!-- Remove Item -->
                <button type="button" class="remove-button" (click)="removeItem(i)"
                    [disabled]="requestItems.length === 1 || submitting">
                    Remove Item
                </button>

            </div>

        </div>

        <p class="loading-message" *ngIf="loadingProducts">
            Loading products...
        </p>

    </div>

    <!-- Form Actions -->
    <div class="form-actions">

        <button type="button" (click)="cancelForm()" [disabled]="submitting">
            Cancel
        </button>

        <button type="submit" [disabled]="submitting || loadingBranches || loadingProducts">
            {{ submitting ? 'Submitting...' : 'Submit Request' }}
        </button>

    </div>

</form>
